ng:14px 0;font-size:20px}.message{margin-top:12px;text-align:center;font-weight:700;min-height:20px}.message.success{color:var(--success)}.message.info{color:var(--accent)}.message.error{color:var(--error)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000000a6;padding:16px}.modal.open{display:flex}.modal-card{width:min(100%,420px);max-height:85vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:16px;padding:18px;box-shadow:0 24px 60px #0008}.modal-card h2{margin:0 0 12px;font-size:20px}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--control);border:1px solid var(--control-border);border-radius:10px;padding:10px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{font-size:18px}.history{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}.history li{background:var(--control);border:1px solid var(--control-border);border-radius:10px;padding:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.empty{color:var(--muted);text-align:center;margin:0 0 14px}.celebration{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000000b3;padding:20px;text-align:center}.celebration.open{display:flex}.celebration-card{background:var(--panel);color:var(--text);padding:28px 22px;border-radius:20px;box-shadow:0 24px 60px #0008;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}.celebration-card h2{margin:0 0 8px;font-size:28px;color:var(--success)}.celebration-card p{margin:0 0 16px}.confetti{position:absolute;top:-10px;width:10px;height:16px;opacity:.9;animation:fall 2.8s linear forwards}@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(720deg);opa <script>
const BOARD_SIZE=9,CELL_COUNT=81,EASY_CLUES=45,STATS_KEY='sudoku-html5-game-stats',MAX_HISTORY=10,board=document.getElementById('board'),pad=document.getElementById('pad'),messageEl=document.getElementById('message'),colorModeButton=document.getElementById('color-mode'),statsModal=document.getElementById('stats-modal'),statsGrid=document.getElementById('stats-grid'),historyList=document.getElementById('history'),celebration=document.getElementById('celebration'),celebrationMessage=document.getElementById('celebration-message');
let puzzle=[],solution=[],current=[],selected=null,mistakes=0,hintsUsed=0,startTime=null,timerId=null,solved=false;
const wrongEntries=new Set();
function idx(row,col){return row*BOARD_SIZE+col}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}
function validPlacement(grid,row,col,value){for(let i=0;i<BOARD_SIZE;i++){if(i!==col&&grid[idx(row,i)]===value)return false;if(i!==row&&grid[idx(i,col)]===value)return false}const boxRow=Math.floor(row/3)*3,boxCol=Math.floor(col/3)*3;for(let r=boxRow;r<boxRow+3;r++)for(let c=boxCol;c<boxCol+3;c++)if((r!==row||c!==col)&&grid[idx(r,c)]===value)return false;return true}
function fullGrid(){const grid=Array(CELL_COUNT).fill(0);function fill(position){if(position===CELL_COUNT)return true;const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(const value of shuffle([1,2,3,4,5,6,7,8,9]))if(validPlacement(grid,row,col,value)){grid[position]=value;if(fill(position+1))return true;grid[position]=0}return false}fill(0);return grid}
function countSolutions(grid,limit=2){let count=0;function search(){for(let position=0;position<CELL_COUNT;position++){if(!grid[position]){const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(let value=1;value<=BOARD_SIZE;value++)if(validPlacement(grid,row,col,value)){grid[position]=value;search();grid[position]=0;if(count>=limit)return}return}}count++}search();return count}
function makePuzzle(clueCount){const grid=fullGrid(),solutionGrid=[...grid],cells=shuffle([...Array(CELL_COUNT).keys()]);let removed=0;for(const position of cells){if(removed>=CELL_COUNT-clueCount)break;const backup=grid[position];grid[position]=0;if(countSolutions([...grid])!==1)grid[position]=backup;else removed++}return{puzzle:grid,solution:solutionGrid}}
function loadStats(){try{const parsed=JSON.parse(localStorage.getItem(STATS_KEY));return{gamesStarted:parsed?.gamesStarted||0,gamesSolved:parsed?.gamesSolved||0,bestTimeSeconds:parsed?.bestTimeSeconds||null,totalTimeSeconds:parsed?.totalTimeSeconds||0,totalMistakes:parsed?.totalMistakes||0,totalHints:parsed?.totalHints||0,history:Array.isArray(parsed?.history)?parsed.history:[]}}catch{return{gamesStarted:0,gamesSolved:0,bestTimeSeconds:null,totalTimeSeconds:0,totalMistakes:0,totalHints:0,history:[]}}}
function saveStats(stats){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch{}}
function getStats(){return loadStats()}
function recordGameStarted(){const stats=getStats();stats.gamesStarted++;saveStats(stats)}
function recordGameSolved(){const seconds=Math.floor((Date.now()-startTime)/1000),stats=getStats();stats.gamesSolved++;stats.totalTimeSeconds+=seconds;stats.totalMistakes+=mistakes;stats.totalHints+=hintsUsed;if(stats.bestTimeSeconds===null||seconds<stats.bestTimeSeconds)stats.bestTimeSeconds=seconds;stats.history.unshift({completedAt:new Date().toISOString(),timeSeconds:seconds,mistakes,hints:hintsUsed});stats.history=stats.history.slice(0,MAX_HISTORY);saveStats(stats)}
function newGame(){const{puzzle:newPuzzle,solution:newSolution}=makePuzzle(EASY_CLUES);puzzle=newPuzzle;solution=newSolution;current=[...puzzle];selected=null;mistakes=0;hintsUsed=0;solved=false;wrongEntries.clear();document.getElementById('mistakes').textContent='Mistakes: 0';setMessage('','');startTimer();recordGameStarted();render()}
function startTimer(){clearInterval(timerId);startTime=Date.now();timerId=setInterval(()=>{document.getElementById('timer').textContent=elapsedTime()},1000)}
function elapsedTime(){const seconds=Math.floor((Date.now()-startTime)/1000);return formatTime(seconds)}
function formatTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function setMessage(text,type=''){messageEl.textContent=text;messageEl.className='message'+(type?' '+type:'')}
function render(){board.innerHTML='';for(let row=0;row<BOARD_SIZE;row++)for(let col=0;col<BOARD_SIZE;col++){const position=idx(row,col),cell=document.createElement('div');cell.className='cell'+(col%3===2&&col!==8?' b-right':'')+(row%3===2&&row!==8?' b-bottom':'')+(puzzle[position]?' given':'')+(position===selected?' selected':'')+(current[position]&&current[position]!==solution[position]?' error':'');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`Row ${row+1}, column ${col+1}`);if(current[position]){cell.textContent=current[position];cell.setAttribute('aria-label',cell.getAttribute('aria-label')+', '+current[position])}cell.onclick=()=>{selected=position;render()};board.appendChild(cell)}}
function showCelebration(){const seconds=Math.floor((Date.now()-startTime)/1000);celebrationMessage.textContent=`You solved the puzzle in ${formatTime(seconds)} with ${mistakes} mistake${mistakes===1?'':'s'} and ${hintsUsed} hint${hintsUsed===1?'':'s'}.`;celebration.classList.add('open');const colors=['#38bdf8','#f472b6','#facc15','#4ade80','#a78bfa','#fb923c'];for(let i=0;i<60;i++){const piece=document.createElement('div');piece.className='confetti';piece.style.left=Math.random()*100+'%';piece.style.background=colors[i%colors.length];piece.style.animationDelay=Math.random()*.8+'s';piece.style.animationDuration=2.2+Math.random()*1.4+'s';celebration.appendChild(piece)}setTimeout(()=>{celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())},4200)}
function finishGame(){solved=true;clearInterval(timerId);recordGameSolved();setMessage('Solved! Time: '+elapsedTime(),'success');showCelebration()}
function input(value){if(selected===null||solved||puzzle[selected])return;current[selected]=value;const key=selected+':'+value;if(value!==solution[selected]){if(!wrongEntries.has(key)){wrongEntries.add(key);mistakes++;document.getElementById('mistakes').textContent='Mistakes: '+mistakes}}else{wrongEntries.delete(key);if(current.every((entry,index)=>entry===solution[index]))finishGame()}render()}
for(let value=1;value<=BOARD_SIZE;value++){const button=document.createElement('button');button.textContent=value;button.setAttribute('aria-label','Enter '+value);button.onclick=()=>input(value);pad.appendChild(button)}
const erase=document.createElement('button');erase.textContent='⌫';erase.setAttribute('aria-label','Erase cell');erase.onclick=()=>{if(selected!==null&&!puzzle[selected]){current[selected]=0;render()}};pad.appendChild(erase);
document.getElementById('new').onclick=()=>{if(confirm('Start a new game? Your current progress will be lost.'))newGame()};
document.getElementById('check').onclick=()=>{const incorrect=current.reduce((total,entry,position)=>total+(entry&&entry!==solution[position]?1:0),0);setMessage(incorrect?incorrect+' incorrect cell(s).':'No incorrect entries so far.',incorrect?'error':'info');render()};
document.getElementById('hint').onclick=()=>{if(solved)return;const emptyPositions=current.map((entry,position)=>entry?null:position).filter(position=>position!==null);if(!emptyPositions.length)return;const position=emptyPositions[Math.floor(Math.random()*emptyPositions.length)];current[position]=solution[position];selected=position;hintsUsed++;if(current.every((entry,index)=>entry===solution[index]))finishGame();render()};
colorModeButton.onclick=()=>{document.body.classList.toggle('light-mode')};
function renderStats(){const stats=getStats(),average=stats.gamesSolved?Math.round(stats.totalTimeSeconds/stats.gamesSolved):null,completionRate=stats.gamesStarted?Math.round(stats.gamesSolved/stats.gamesStarted*100):0;statsGrid.innerHTML=`<div class="stat"><span>Games started</span><strong>${stats.gamesStarted}</strong></div><div class="stat"><span>Games solved</span><strong>${stats.gamesSolved}</strong></div><div class="stat"><span>Completion rate</span><strong>${completionRate}%</strong></div><div class="stat"><span>Best time</span><strong>${stats.bestTimeSeconds===null?'—':formatTime(stats.bestTimeSeconds)}</strong></div><div class="stat"><span>Average time</span><strong>${average===null?'—':formatTime(average)}</strong></div><div class="stat"><span>Total mistakes</span><strong>${stats.totalMistakes}</strong></div><div class="stat"><span>Hints used</span><strong>${stats.totalHints}</strong></div><div class="stat"><span>Total play time</span><strong>${formatTime(stats.totalTimeSeconds)}</strong></div>`;historyList.innerHTML=stats.history.length?'':'<li class="empty">No completed games yet.</li>';stats.history.forEach(entry=>{const item=document.createElement('li');const date=new Date(entry.completedAt).toLocaleString();item.innerHTML=`<span>${date}</span><span>${formatTime(entry.timeSeconds)} · ${entry.mistakes} mistakes · ${entry.hints} hints</span>`;historyList.appendChild(item)})}
function openStats(){renderStats();statsModal.classList.add('open')}
function closeStats(){statsModal.classList.remove('open')}
document.getElementById('stats').onclick=openStats;
document.getElementById('close-stats').onclick=closeStats;
document.getElementById('clear-stats').onclick=()=>{if(confirm('Clear all saved Sudoku statistics and history?')){localStorage.removeItem(STATS_KEY);renderStats()}};
statsModal.addEventListener('click',event=>{if(event.target===statsModal)closeStats()});
document.getElementById('close-celebration').onclick=()=>{celebration.classList.remove('open');celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())};
celebration.addEventListener('click',event=>{if(event.target===celebration){celebration.classList.remove('open');celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())}});
document.addEventListener('keydown',event=>{if(event.key>='1'&&event.key<='9')input(+event.key);if(event.key==='Backspace'||event.key==='Delete'){if(selected!==null&&!puzzle[selected]){current[selected]=0;render()}}if(event.key==='Escape'){closeStats();celebration.classList.remove('open')}});
newGame();
</script>
</body>
</html>
