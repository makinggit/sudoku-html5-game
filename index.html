<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>HTML5 Sudoku</title>\n<style>\n:root{--bg:#0f172a;--panel:#1e293b;--text:#e2e8f0;--accent:#38bdf8;--error:#f87171;--given:#94a3b8;--success:#4ade80}\n*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{width:min(94vw,520px);padding:20px;background:var(--panel);border-radius:16px;box-shadow:0 20px 50px #0006}h1{margin:0 0 14px;font-size:22px;text-align:center}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}button{background:#0f172a;color:var(--text);border:1px solid #475569;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}button:hover{border-color:var(--accent)}#board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);aspect-ratio:1;background:#0f172a;border:2px solid #64748b;border-radius:8px;overflow:hidden}.cell{display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5vw,26px);font-weight:700;border:.5px solid #475569;cursor:pointer;user-select:none}.cell.b-right{border-right:2px solid #94a3b8}.cell.b-bottom{border-bottom:2px solid #94a3b8}.cell.given{color:var(--given)}.cell.selected{background:#0ea5e94d}.cell.error{color:var(--error)}.status{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.pad button{padding:12px 0;font-size:18px}.message{margin-top:12px;text-align:center;font-weight:700;min-height:20px}.message.success{color:var(--success)}.message.info{color:var(--accent)}.message.error{color:var(--error)}\n</style>\n</head>\n<body>\n<div class=\"app\">\n<h1>HTML5 Sudoku</h1>\n<div class=\"controls\">\n<button id=\"new\">New Game</button><button id=\"check\">Check</button><button id=\"hint\">Hint</button>\n</div>\n<div id=\"board\" role=\"grid\" aria-label=\"Sudoku board\"></div>\n<div class=\"pad\" id=\"pad\"></div>\n<div class=\"status\"><span id=\"timer\">00:00</span><span id=\"mistakes\">Mistakes: 0</span></div>\n<div class=\"message\" id=\"message\" role=\"status\"></div>\n</div>\n<script>\nconst BOARD_SIZE=9,CELL_COUNT=81,EASY_CLUES=45,board=document.getElementById('board'),pad=document.getElementById('pad'),messageEl=document.getElementById('message');\nlet puzzle=[],solution=[],current=[],selected=null,mistakes=0,startTime=null,timerId=null,solved=false;\nconst checkedErrors=new Set();\nfunction idx(row,col){return row*BOARD_SIZE+col}\nfunction shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}\nfunction validPlacement(grid,row,col,value){for(let i=0;i<BOARD_SIZE;i++){if(i!==col&&grid[idx(row,i)]===value)return false;if(i!==row&&grid[idx(i,col)]===value)return false}const boxRow=Math.floor(row/3)*3,boxCol=Math.floor(col/3)*3;for(let r=boxRow;r<boxRow+3;r++)for(let c=boxCol;c<boxCol+3;c++)if((r!==row||c!==col)&&grid[idx(r,c)]===value)return false;return true}\nfunction fullGrid(){const grid=Array(CELL_COUNT).fill(0);function fill(position){if(position===CELL_COUNT)return true;const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(const value of shuffle([1,2,3,4,5,6,7,8,9]))if(validPlacement(grid,row,col,value)){grid[position]=value;if(fill(position+1))return true;grid[position]=0}return false}fill(0);return grid}\nfunction countSolutions(grid,limit=2){let count=0;function search(){for(let position=0;position<CELL_COUNT;position++){if(!grid[position]){const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(let value=1;value<=BOARD_SIZE;value++)if(validPlacement(grid,row,col,value)){grid[position]=value;search();grid[position]=0;if(count>=limit)return}return}}count++}search();return count}\nfunction makePuzzle(clueCount){const grid=fullGrid(),solutionGrid=[...grid],cells=shuffle([...Array(CELL_COUNT).keys()]);let removed=0;for(const position of cells){if(removed>=CELL_COUNT-clueCount)break;const backup=grid[position];grid[position]=0;if(countSolutions([...grid])!==1)grid[position]=backup;else removed++}return{puzzle:grid,solution:solutionGrid}}\nfunction newGame(){const{puzzle:newPuzzle,solution:newSolution}=makePuzzle(EASY_CLUES);puzzle=newPuzzle;solution=newSolution;current=[...puzzle];selected=null;mistakes=0;solved=false;checkedErrors.clear();document.getElementById('mistakes').textContent='Mistakes: 0';setMessage('','');startTimer();render()}\nfunction startTimer(){clearInterval(timerId);startTime=Date.now();timerId=setInterval(()=>{document.getElementById('timer').textContent=elapsedTime()},1000)}\nfunction elapsedTime(){const seconds=Math.floor((Date.now()-startTime)/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}\nfunction setMessage(text,type=''){messageEl.textContent=text;messageEl.className='message'+(type?' '+type:'')}\nfunction render(){board.innerHTML='';for(let row=0;row<BOARD_SIZE;row++)for(let col=0;col<BOARD_SIZE;col++){const position=idx(row,col),cell=document.createElement('div');cell.className='cell'+(col%3===2&&col!==8?' b-right':'')+(row%3===2&&row!==8?' b-bottom':'')+(puzzle[position]?' given':'')+(position===selected?' selected':'')+(checkedErrors.has(position)?' error':'');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`Row ${row+1}, column ${col+1}`);if(current[position]){cell.textContent=current[position];cell.setAttribute('aria-label',cell.getAttribute('aria-label')+', '+current[position])}cell.onclick=()=>{selected=position;render()};board.appendChild(cell)}}\nfunction finishGame(){solved=true;clearInterval(timerId);setMessage('Solved! Time: '+elapsedTime(),'success')}\nfunction input(value){if(selected===null||solved||puzzle[selected])return;current[selected]=value;checkedErrors.delete(selected);render()}\nfor(let value=1;value<=BOARD_SIZE;value++){const button=document.createElement('button');button.textContent=value;button.setAttribute('aria-label','Enter '+value);button.onclick=()=>input(value);pad.appendChild(button)}\nconst erase=document.createElement('button');erase.textContent='⌫';erase.setAttribute('aria-label','Erase cell');erase.onclick=()=>{if(selected!==null&&!puzzle[selected]){current[selected]=0;checkedErrors.delete(selected);render()}};pad.appendChild(erase);\ndocument.getElementById('new').onclick=newGame;\ndocument.getElementById('check').onclick=()=>{checkedErrors.clear();let incorrect=0;current.forEach((entry,position)=>{if(entry&&entry!==solution[position]){checkedErrors.add(position);incorrect++}});document.getElementById('mistakes').textContent='Mistakes: '+incorrect;setMessage(incorrect?incorrect+' incorrect cell(s).':'No incorrect entries so far.',incorrect?'error':'info');render()};\ndocument.getElementById('hint').onclick=()=>{if(solved)return;const emptyPositions=current.map((entry,position)=>entry?null:position).filter(position=>position!==null);if(!emptyPositions.length)return;const position=emptyPositions[Math.floor(Math.random()*emptyPositions.length)];current[position]=solution[position];checkedErrors.delete(position);selected=position;if(current.every((entry,index)=>entry===solution[index]))finishGame();render()};\ndocument.addEventListener('keydown',event=>{if(event.key>='1'&&event.key<='9')input(+event.key);if(event.key==='Backspace'||event.key==='Delete'){if(selected!==null&&!puzzle[selected]){current[selected]=0;checkedErrors.delete(selected);render()}}});\nnewGame();\n</script>\n</body>\n</html>
