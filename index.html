],['君子無所爭，必也射乎。','《論語》'],['君子居之，何陋之有？','《論語》'],['君子居易以俟命，小人行險以徼幸。','《中庸》'],['君子素其位而行，不願乎其外。','《中庸》'],['君子之道，辟如行遠必自邇。','《中庸》'],['君子之道，淡而不厭，簡而文，溫而理。','《中庸》'],['君子內省不疚，無惡於志。','《中庸》'],['君子戒慎乎其所不睹，恐懼乎其所不聞。','《中庸》'],['君子不可以不修身；思修身，不可以不事親。','《中庸》'],['君子動而世為天下道，行而世為天下法。','《中庸》'],['君子尊德性而道問學。','《中庸》'],['君子敦厚以崇禮。','《中庸》'],['君子篤恭而天下平。','《中庸']];
let puzzle=[],solution=[],current=[],selected=null,hintsUsed=0,startTime=null,timerId=null,solved=false,checked=false,lastGoldData=null;
function idx(row,col){return row*BOARD_SIZE+col}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}
function showQuote(){const[quote,source]=QUOTES[Math.floor(Math.random()*QUOTES.length)];quoteText.textContent=quote;quoteSource.textContent='— '+source}
function validPlacement(grid,row,col,value){for(let i=0;i<BOARD_SIZE;i++){if(i!==col&&grid[idx(row,i)]===value)return false;if(i!==row&&grid[idx(i,col)]===value)return false}const boxRow=Math.floor(row/3)*3,boxCol=Math.floor(col/3)*3;for(let r=boxRow;r<boxRow+3;r++)for(let c=boxCol;c<boxCol+3;c++)if((r!==row||c!==col)&&grid[idx(r,c)]===value)return false;return true}
function fullGrid(){const grid=Array(CELL_COUNT).fill(0);function fill(position){if(position===CELL_COUNT)return true;const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(const value of shuffle([1,2,3,4,5,6,7,8,9]))if(validPlacement(grid,row,col,value)){grid[position]=value;if(fill(position+1))return true;grid[position]=0}return false}fill(0);return grid}
function countSolutions(grid,limit=2){let count=0;function search(){for(let position=0;position<CELL_COUNT;position++){if(!grid[position]){const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(let value=1;value<=BOARD_SIZE;value++)if(validPlacement(grid,row,col,value)){grid[position]=value;search();grid[position]=0;if(count>=limit)return}return}}count++}search();return count}
function makePuzzle(clueCount){const grid=fullGrid(),solutionGrid=[...grid],cells=shuffle([...Array(CELL_COUNT).keys()]);let removed=0;for(const position of cells){if(removed>=CELL_COUNT-clueCount)break;const backup=grid[position];grid[position]=0;if(countSolutions([...grid])!==1)grid[position]=backup;else removed++}return{puzzle:grid,solution:solutionGrid}}
function loadStats(){try{const parsed=JSON.parse(localStorage.getItem(STATS_KEY));return{gamesStarted:parsed?.gamesStarted||0,gamesSolved:parsed?.gamesSolved||0,bestTimeSeconds:parsed?.bestTimeSeconds||null,totalTimeSeconds:parsed?.totalTimeSeconds||0,totalHints:parsed?.totalHints||0,history:Array.isArray(parsed?.history)?parsed.history:[]}}catch{return{gamesStarted:0,gamesSolved:0,bestTimeSeconds:null,totalTimeSeconds:0,totalHints:0,history:[]}}}
function saveStats(stats){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch{}}
function getStats(){return loadStats()}
function recordGameStarted(){const stats=getStats();stats.gamesStarted++;saveStats(stats)}
function recordGameSolved(){const seconds=Math.floor((Date.now()-startTime)/1000),stats=getStats();stats.gamesSolved++;stats.totalTimeSeconds+=seconds;stats.totalHints+=hintsUsed;if(stats.bestTimeSeconds===null||seconds<stats.bestTimeSeconds)stats.bestTimeSeconds=seconds;stats.history.unshift({completedAt:new Date().toISOString(),timeSeconds:seconds,hints:hintsUsed});stats.history=stats.history.slice(0,MAX_HISTORY);saveStats(stats)}
function newGame(countStart=true){const{puzzle:newPuzzle,solution:newSolution}=makePuzzle(EASY_CLUES);puzzle=newPuzzle;solution=newSolution;current=[...puzzle];selected=null;hintsUsed=0;solved=false;checked=false;document.getElementById('hints').textContent='提示：0';setMessage('','');startTimer();if(countStart)recordGameStarted();showQuote();render()}
function startTimer(){clearInterval(timerId);startTime=Date.now();timerId=setInterval(()=>{document.getElementById('timer').textContent=elapsedTime()},1000)}
function elapsedTime(){const seconds=Math.floor((Date.now()-startTime)/1000);return formatTime(seconds)}
function formatTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function formatGoldTime(timestamp){const date=new Date(timestamp*1000),pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`}
function setMessage(text,type=''){messageEl.textContent=text;messageEl.className='message'+(type?' '+type:'')}
function updateThemeColor(){if(themeColorMeta)themeColorMeta.setAttribute('content',document.body.classList.contains('light-mode')?'#f1f5f9':'#0f172a')}
function render(){board.innerHTML='';for(let row=0;row<BOARD_SIZE;row++)for(let col=0;col<BOARD_SIZE;col++){const position=idx(row,col),cell=document.createElement('div'),label=`第 ${row+1} 列，第 ${col+1} 欄`+(current[position]?'，'+current[position]:''),isError=checked&&current[position]&&current[position]!==solution[position];cell.className='cell'+(col%3===2&&col!==8?' b-right':'')+(row%3===2&&row!==8?' b-bottom':'')+(puzzle[position]?' given':'')+(position===selected?' selected':'')+(isError?' error':'');cell.setAttribute('role','gridcell');cell.setAttribute('tabindex','0');cell.setAttribute('aria-label',label);if(current[position])cell.textContent=current[position];cell.onclick=()=>{selected=position;render()};cell.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selected=position;render()}};board.appendChild(cell)}}
function showCelebration(){const seconds=Math.floor((Date.now()-startTime)/1000);celebrationMessage.textContent=`你在 ${formatTime(seconds)} 內完成，使用提示 ${hintsUsed} 次。`;celebration.classList.add('open');const colors=['#38bdf8','#f472b6','#facc15','#4ade80','#a78bfa','#fb923c'];for(let i=0;i<60;i++){const piece=document.createElement('div');piece.className='confetti';piece.style.left=Math.random()*100+'%';piece.style.background=colors[i%colors.length];piece.style.animationDelay=Math.random()*.8+'s';piece.style.animationDuration=2.2+Math.random()*1.4+'s';celebration.appendChild(piece)}setTimeout(()=>{celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())},4200)}
function finishGame(){solved=true;clearInterval(timerId);recordGameSolved();setMessage('完成！時間：'+elapsedTime(),'success');showCelebration()}
function input(value){if(selected===null||solved||puzzle[selected])return;current[selected]=value;checked=false;setMessage('','');if(current.every((entry,index)=>entry===solution[index]))finishGame();render()}
for(let value=1;value<=BOARD_SIZE;value++){const button=document.createElement('button');button.textContent=value;button.setAttribute('aria-label','輸入 '+value);button.onclick=()=>input(value);pad.appendChild(button)}
const erase=document.createElement('button');erase.className='erase';erase.textContent='⌫';erase.setAttribute('aria-label','清除格子');erase.onclick=()=>{if(selected!==null&&!puzzle[selected]){current[selected]=0;checked=false;setMessage('','');render()}};pad.appendChild(erase);
document.getElementById('new').onclick=()=>{if(solved||confirm('開始新遊戲？'))newGame()};
document.getElementById('check').onclick=()=>{checked=true;const incorrect=current.reduce((total,entry,position)=>total+(entry&&entry!==solution[position]?1:0),0);setMessage(incorrect?`有 ${incorrect} 個錯誤格子。`:'目前沒有錯誤。',incorrect?'error':'info');render()};
document.getElementById('hint').onclick=()=>{if(solved)return;const emptyPositions=current.map((entry,position)=>entry?null:position).filter(position=>position!==null);if(!emptyPositions.length)return;const position=emptyPositions[Math.floor(Math.random()*emptyPositions.length)];current[position]=solution[position];selected=position;hintsUsed++;document.getElementById('hints').textContent='提示：'+hintsUsed;if(current.every((entry,index)=>entry===solution[index]))finishGame();render()};
colorModeButton.onclick=()=>{document.body.classList.toggle('light-mode');const mode=document.body.classList.contains('light-mode')?'light':'dark';try{localStorage.setItem(COLOR_KEY,mode)}catch{}updateThemeColor()};
try{if(localStorage.getItem(COLOR_KEY)==='light')document.body.classList.add('light-mode')}catch{}
updateThemeColor();

quoteCard.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showQuote()}});
function readGoldCache(){try{return JSON.parse(localStorage.getItem(GOLD_CACHE_KEY))}catch{return null}}
function writeGoldCache(data){try{localStorage.setItem(GOLD_CACHE_KEY,JSON.stringify({data,fetchedAt:Date.now()}))}catch{}}
function clearGoldCache(){try{localStorage.removeItem(GOLD_CACHE_KEY)}catch{}}
function todayRefreshTime(){const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate(),GOLD_DAILY_HOUR,0,0,0)}
function shouldRefreshDaily(cache){const now=new Date();if(now<todayRefreshTime())return false;const fetchedAt=cache?.fetchedAt||0;return fetchedAt<todayRefreshTime().getTime()}
function renderGold(data){if(data&&typeof data.price==='number'){lastGoldData=data;goldPriceEl.innerHTML=`金價：<strong>$${data.price.toFixed(2)}</strong>（${formatGoldTime(data.timestamp)}）`}else goldPriceEl.textContent='金價資料無法取得'}
function fetchGoldPrice(force=false){const cache=readGoldCache();if(!force&&cache?.data&&Date.now()-cache.fetchedAt<GOLD_REFRESH_MS&&!shouldRefreshDaily(cache)){renderGold(cache.data);return}if(typeof fetch!=='function')return;fetch(GOLD_API,{method:'GET',headers:{'x-access-token':GOLD_API_KEY,'Content-Type':'application/json'},redirect:'follow'}).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then(data=>{if(data&&typeof data.price==='number'){writeGoldCache(data);renderGold(data)}else renderGold(null)}).catch(()=>{if(cache?.data)renderGold(cache.data);else goldPriceEl.textContent='金價資料無法取得'})}
function showGoldDetails(){if(!lastGoldData){goldDetails.innerHTML='<p class="empty">金價資料尚未載入。</p>'}else{const d=lastGoldData,metalNames={XAU:'黃金',XAG:'白銀',XPT:'鉑金',XPD:'鈀金'},changeCls=d.change>0?'up':(d.change<0?'down':''),changeText=`${d.change>0?'+':''}${Number(d.change).toFixed(2)}（${d.change>0?'+':''}${Number(d.change_percent).toFixed(2)}%）`,melt=d.melt_price_per_gram||{},unitPrice=d.price_per_unit||{},currency=d.currency_info||{};goldDetails.innerHTML=`<div class="stats-grid">${goldStat('金屬',metalNames[d.metal]||d.metal)}${goldStat('貨幣',currency.name?`${currency.name}（${currency.symbol||currency.code||d.currency}）`:d.currency)}${goldStat('目前價格',`$${d.price.toFixed(2)}`)}${goldStat('更新時間',formatGoldTime(d.timestamp))}</div><div class="gold-section">市場行情</div><div class="stats-grid">${goldStat('漲跌',changeText,changeCls)}${goldStat('前收盤',`$${Number(d.prev_close_price).toFixed(2)}`)}${goldStat('開盤價',`$${Number(d.open_price).toFixed(2)}`)}${goldStat('當日最高',`$${Number(d.high_price).toFixed(2)}`)}${goldStat('當日最低',`$${Number(d.low_price).toFixed(2)}`)}${goldStat('開盤時間',formatGoldTime(d.open_time))}</div><div class="gold-section">買賣價</div><div class="stats-grid">${goldStat('買入價（Bid）',`$${Number(d.bid).toFixed(2)}`)}${goldStat('賣出價（Ask）',`$${Number(d.ask).toFixed(2)}`)}</div><div class="gold-section">單位換算</div><div class="stats-grid">${goldStat('每金衡盎司',`$${Number(unitPrice.troy_ounce).toFixed(2)}`)}${goldStat('每克',`$${Number(unitPrice.gram).toFixed(2)}`)}${goldStat('每公斤',`$${Number(unitPrice.kilogram).toFixed(2)}`)}${goldStat('報價單位',d.unit==='troy_ounce'?'金衡盎司':d.unit)}</div><div class="gold-section">成色每克價</div><div class="stats-grid">${goldStat('24K',`$${Number(melt['24k']).toFixed(2)}`)}${goldStat('22K',`$${Number(melt['22k']).toFixed(2)}`)}${goldStat('18K',`$${Number(melt['18k']).toFixed(2)}`)}${goldStat('交易所',d.exchange||'—')}</div>`}goldModal.classList.add('open')}
function goldStat(label,value,cls=''){return `<div class="stat ${cls}"><span>${label}</span><strong>${value}</strong></div>`}
function closeGold(){goldModal.classList.remove('open')}
goldBar.onclick=showGoldDetails;
goldBar.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showGoldDetails()}});
document.getElementById('close-gold').onclick=closeGold;
goldModal.addEventListener('click',event=>{if(event.target===goldModal)closeGold()});
fetchGoldPrice();
setInterval(()=>{const cache=readGoldCache();if(shouldRefreshDaily(cache)){clearGoldCache();fetchGoldPrice(true)}},60000);

function openStats(){renderStats();statsModal.classList.add('open')}

document.getElementById('stats').onclick=openStats;
document.getElementById('close-stats').onclick=closeStats;
document.getElementById('clear-stats').onclick=()=>{if(confirm('清除所有已儲存的數獨統計與紀錄？')){localStorage.removeItem(STATS_KEY);renderStats()}};

document.getElementById('close-celebration').onclick=()=>{celebration.classList.remove('open');celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())};
celebration.addEventListener('click',event=>{if(event.target===celebration){celebration.classList.remove('open');celebration.querySelectorAll('.confetti').forEach(piece=>piece.remove())}});
document.addEventListener('keydown',event=>{const overlayOpen=statsModal.classList.contains('open')||celebration.classList.contains('open')||goldModal.classList.contains('open');if(event.key==='Escape'){closeStats();closeGold();celebration.classList.remove('open');return}if(overlayOpen)return;if(event.key>='1'&&event.key<='9')input(+event.key);if(event.key==='Backspace'||event.key==='Delete'){if(selected!==null&&!puzzle[selected]){current[selected]=0;checked=false;setMessage('','');render()}}});
newGame(false);
