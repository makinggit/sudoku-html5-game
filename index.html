<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sudoku</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--board:#0f172a;--cell-border:#475569;--strong-border:#94a3b8;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--error:#f87171;--success:#4ade80;--control:#0f172a;--control-border:#475569;--selected:#0ea5e94d;--safe-bottom:env(safe-area-inset-bottom,0px)}
body.light-mode{--bg:#f1f5f9;--panel:#ffffff;--board:#ffffff;--cell-border:#cbd5e1;--strong-border:#64748b;--text:#0f172a;--muted:#475569;--accent:#0284c7;--error:#dc2626;--success:#16a34a;--control:#e2e8f0;--control-border:#94a3b8;--selected:#7dd3fc80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:12px;padding-bottom:calc(96px + var(--safe-bottom));touch-action:manipulation}.app{width:min(100%,520px);padding:14px;background:var(--panel);border-radius:16px;box-shadow:0 20px 50px #0006}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}button{background:var(--control);color:var(--text);border:1px solid var(--control-border);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;min-width:44px;touch-action:manipulation;user-select:none}button:hover{border-color:var(--accent)}button:active{transform:scale(.97)}#board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:100%;max-width:100%;aspect-ratio:1;background:var(--board);border:2px solid var(--strong-border);border-radius:10px;overflow:hidden}.cell{display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5.2vw,28px);font-weight:700;border:.5px solid var(--cell-border);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}.cell.b-right{border-right:2px solid var(--strong-border)}.cell.b-bottom{border-bottom:2px solid var(--strong-border)}.cell.given{color:var(--muted)}.cell.selected{background:var(--selected)}.cell.error{color:var(--error)}.status{display:flex;justify-content:space-between;gap:8px;margin-top:12px;font-size:14px}.pad{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + var(--safe-bottom)) max(12px,env(safe-area-inset-right));background:var(--panel);border-top:1px solid var(--control-border);box-shadow:0 -8px 24px #0005}.pad button{padding:14px 0;font-size:20px}.message{margin-top:12px;text-align:center;font-weight:700;min-height:20px}.message.success{color:var(--success)}.message.info{color:var(--accent)}.message.error{color:var(--error)}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000000a6;padding:16px}.modal.open{display:flex}.modal-card{width:min(100%,420px);max-height:85vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:16px;padding:18px;box-shadow:0 24px 60px #0008}.modal-card h2{margin:0 0 12px;font-size:20px}.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}.stat{background:var(--control);border:1px solid var(--control-border);border-radius:10px;padding:10px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{font-size:18px}.history{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}.history li{background:var(--control);border:1px solid var(--control-border);border-radius:10px;padding:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.empty{color:var(--muted);text-align:center;margin:0 0 14px}@media (min-width:700px){body{align-items:center;padding-bottom:12px}.pad{position:static;grid-template-columns:repeat(10,1fr);padding:0;margin-top:14px;background:transparent;border:0;box-shadow:none}.pad button{padding:12px 0;font-size:18px}}
</style>
</head>
<body>
<div class="app">
<div class="controls">
<button id="new">New Game</button><button id="check">Check</button><button id="hint">Hint</button><button id="stats">Stats</button><button id="color-mode">Light mode</button>
</div>
<div id="board" role="grid" aria-label="Sudoku board"></div>
<div class="status"><span id="timer">00:00</span><span id="mistakes">Mistakes: 0</span></div>
<div class="message" id="message" role="status"></div>
<div class="pad" id="pad"></div>
</div>
<div class="modal" id="stats-modal" role="dialog" aria-modal="true" aria-labelledby="stats-title">
<div class="modal-card">
<h2 id="stats-title">Game statistics</h2>
<div class="stats-grid" id="stats-grid"></div>
<h3>Recent games</h3>
<ul class="history" id="history"></ul>
<div class="modal-actions"><button id="clear-stats">Clear stats</button><button id="close-stats">Close</button></div>
</div>
</div>
<script>
const BOARD_SIZE=9,CELL_COUNT=81,EASY_CLUES=45,STATS_KEY='sudoku-html5-game-stats',MAX_HISTORY=10,board=document.getElementById('board'),pad=document.getElementById('pad'),messageEl=document.getElementById('message'),colorModeButton=document.getElementById('color-mode'),statsModal=document.getElementById('stats-modal'),statsGrid=document.getElementById('stats-grid'),historyList=document.getElementById('history');
let puzzle=[],solution=[],current=[],selected=null,mistakes=0,hintsUsed=0,startTime=null,timerId=null,solved=false;
const checkedErrors=new Set();
function idx(row,col){return row*BOARD_SIZE+col}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]]}return array}
function validPlacement(grid,row,col,value){for(let i=0;i<BOARD_SIZE;i++){if(i!==col&&grid[idx(row,i)]===value)return false;if(i!==row&&grid[idx(i,col)]===value)return false}const boxRow=Math.floor(row/3)*3,boxCol=Math.floor(col/3)*3;for(let r=boxRow;r<boxRow+3;r++)for(let c=boxCol;c<boxCol+3;c++)if((r!==row||c!==col)&&grid[idx(r,c)]===value)return false;return true}
function fullGrid(){const grid=Array(CELL_COUNT).fill(0);function fill(position){if(position===CELL_COUNT)return true;const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(const value of shuffle([1,2,3,4,5,6,7,8,9]))if(validPlacement(grid,row,col,value)){grid[position]=value;if(fill(position+1))return true;grid[position]=0}return false}fill(0);return grid}
function countSolutions(grid,limit=2){let count=0;function search(){for(let position=0;position<CELL_COUNT;position++){if(!grid[position]){const row=Math.floor(position/BOARD_SIZE),col=position%BOARD_SIZE;for(let value=1;value<=BOARD_SIZE;value++)if(validPlacement(grid,row,col,value)){grid[position]=value;search();grid[position]=0;if(count>=limit)return}return}}count++}search();return count}
function makePuzzle(clueCount){const grid=fullGrid(),solutionGrid=[...grid],cells=shuffle([...Array(CELL_COUNT).keys()]);let removed=0;for(const position of cells){if(removed>=CELL_COUNT-clueCount)break;const backup=grid[position];grid[position]=0;if(countSolutions([...grid])!==1)grid[position]=backup;else removed++}return{puzzle:grid,solution:solutionGrid}}
function loadStats(){try{const parsed=JSON.parse(localStorage.getItem(STATS_KEY));return{gamesStarted:parsed?.gamesStarted||0,gamesSolved:parsed?.gamesSolved||0,bestTimeSeconds:parsed?.bestTimeSeconds||null,totalTimeSeconds:parsed?.totalTimeSeconds||0,totalMistakes:parsed?.totalMistakes||0,totalHints:parsed?.totalHints||0,history:Array.isArray(parsed?.history)?parsed.history:[]}}catch{return{gamesStarted:0,gamesSolved:0,bestTimeSeconds:null,totalTimeSeconds:0,totalMistakes:0,totalHints:0,history:[]}}}
function saveStats(stats){try{localStorage.setItem(STATS_KEY,JSON.stringify(stats))}catch{}}
function getStats(){return loadStats()}
function recordGameStarted(){const stats=getStats();stats.gamesStarted++;saveStats(stats)}
function recordGameSolved(){const seconds=Math.floor((Date.now()-startTime)/1000),stats=getStats();stats.gamesSolved++;stats.totalTimeSeconds+=seconds;stats.totalMistakes+=mistakes;stats.totalHints+=hintsUsed;if(stats.bestTimeSeconds===null||seconds<stats.bestTimeSeconds)stats.bestTimeSeconds=seconds;stats.history.unshift({completedAt:new Date().toISOString(),timeSeconds:seconds,mistakes,hints:hintsUsed});stats.history=stats.history.slice(0,MAX_HISTORY);saveStats(stats)}
function newGame(){const{puzzle:newPuzzle,solution:newSolution}=makePuzzle(EASY_CLUES);puzzle=newPuzzle;solution=newSolution;current=[...puzzle];selected=null;mistakes=0;hintsUsed=0;solved=false;checkedErrors.clear();document.getElementById('mistakes').textContent='Mistakes: 0';setMessage('','');startTimer();recordGameStarted();render()}
function startTimer(){clearInterval(timerId);startTime=Date.now();timerId=setInterval(()=>{document.getElementById('timer').textContent=elapsedTime()},1000)}
function elapsedTime(){const seconds=Math.floor((Date.now()-startTime)/1000);return formatTime(seconds)}
function formatTime(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function setMessage(text,type=''){messageEl.textContent=text;messageEl.className='message'+(type?' '+type:'')}
function render(){board.innerHTML='';for(let row=0;row<BOARD_SIZE;row++)for(let col=0;col<BOARD_SIZE;col++){const position=idx(row,col),cell=document.createElement('div');cell.className='cell'+(col%3===2&&col!==8?' b-right':'')+(row%3===2&&row!==8?' b-bottom':'')+(puzzle[position]?' given':'')+(position===selected?' selected':'')+(checkedErrors.has(position)?' error':'');cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',`Row ${row+1}, column ${col+1}`);if(current[position]){cell.textContent=current[position];cell.setAttribute('aria-label',cell.getAttribute('aria-label')+', '+current[position])}cell.onclick=()=>{selected=position;render()};board.appendChild(cell)}}
function finishGame(){solved=true;clearInterval(timerId);recordGameSolved();setMessage('Solved! Time: '+elapsedTime(),'success')}
function input(value){if(selected===null||solved||puzzle[selected])return;current[selected]=value;checkedErrors.delete(selected);render()}
for(let value=1;value<=BOARD_SIZE;value++){const button=document.createElement('button');button.textContent=value;button.setAttribute('aria-label','Enter '+value);button.onclick=()=>input(value);pad.appendChild(button)}
const erase=document.createElement('button');erase.textContent='⌫';erase.setAttribute('aria-label','Erase cell');erase.onclick=()=>{if(selected!==null&&!puzzle[selected]){current[selected]=0;checkedErrors.delete(selected);render()}};pad.appendChild(erase);
document.getElementById('new').onclick=newGame;
document.getElementById('check').onclick=()=>{checkedErrors.clear();let incorrect=0;current.forEach((entry,position)=>{if(entry&&entry!==solution[position]){checkedErrors.add(position);incorrect++}});document.getElementById('mistakes').textContent='Mistakes: '+incorrect;setMessage(incorrect?incorrect+' incorrect cell(s).':'No incorrect entries so far.',incorrect?'error':'info');render()};
document.getElementById('hint').onclick=()=>{if(solved)return;const emptyPositions=current.map((entry,position)=>entry?null:position).filter(position=>position!==null);if(!emptyPositions.length)return;const position=emptyPositions[Math.floor(Math.random()*emptyPositions.length)];current[position]=solution[position];checkedErrors.delete(position);selected=position;hintsUsed++;if(current.every((entry,index)=>entry===solution[index]))finishGame();render()};
colorModeButton.onclick=()=>{const isLight=document.body.classList.toggle('light-mode');colorModeButton.textContent=isLight?'Dark mode':'Light mode'};
function renderStats(){const stats=getStats(),average=stats.gamesSolved?Math.round(stats.totalTimeSeconds/stats.gamesSolved):null,completionRate=stats.gamesStarted?Math.round(stats.gamesSolved/stats.gamesStarted*100):0;statsGrid.innerHTML=`<div class="stat"><span>Games started</span><strong>${stats.gamesStarted}</strong></div><div class="stat"><span>Games solved</span><strong>${stats.gamesSolved}</strong></div><div class="stat"><span>Completion rate</span><strong>${completionRate}%</strong></div><div class="stat"><span>Best time</span><strong>${stats.bestTimeSeconds===null?'—':formatTime(stats.bestTimeSeconds)}</strong></div><div class="stat"><span>Average time</span><strong>${average===null?'—':formatTime(average)}</strong></div><div class="stat"><span>Total mistakes</span><strong>${stats.totalMistakes}</strong></div><div class="stat"><span>Hints used</span><strong>${stats.totalHints}</strong></div><div class="stat"><span>Total play time</span><strong>${formatTime(stats.totalTimeSeconds)}</strong></div>`;historyList.innerHTML=stats.history.length?'':'<li class="empty">No completed games yet.</li>';stats.history.forEach(entry=>{const item=document.createElement('li');const date=new Date(entry.completedAt).toLocaleString();item.innerHTML=`<span>${date}</span><span>${formatTime(entry.timeSeconds)} · ${entry.mistakes} mistakes · ${entry.hints} hints</span>`;historyList.appendChild(item)})}
function openStats(){renderStats();statsModal.classList.add('open')}
function closeStats(){statsModal.classList.remove('open')}
document.getElementById('stats').onclick=openStats;
document.getElementById('close-stats').onclick=closeStats;
document.getElementById('clear-stats').onclick=()=>{if(confirm('Clear all saved Sudoku statistics and history?')){localStorage.removeItem(STATS_KEY);renderStats()}};
statsModal.addEventListener('click',event=>{if(event.target===statsModal)closeStats()});
document.addEventListener('keydown',event=>{if(event.key>='1'&&event.key<='9')input(+event.key);if(event.key==='Backspace'||event.key==='Delete'){if(selected!==null&&!puzzle[selected]){current[selected]=0;checkedErrors.delete(selected);render()}}if(event.key==='Escape')closeStats()});
newGame();
</script>
</body>
</html>
