		<span id="timer">00:00</span>
		<div class="message" id="message" role="status"></div>
		<button id="hint" type="button">提示：0</button>
	</div>
	<div class="quote" id="quote" role="button" tabindex="0" aria-label="顯示另一句中華文化經典語句">
		<span id="quote-text"></span>
	</div>
	<div class="gold-bar" id="gold-bar" role="button" tabindex="0" aria-label="顯示金價詳細資訊">
		<span>金價：<strong id="gold-price-value">載入中…</strong></span>
		<span id="gold-price-time"></span>
	</div>
	<div class="bottom-stack">
		<div class="pad" id="pad">
			<button type="button" data-value="1" aria-label="輸入 1">1</button>
			<button type="button" data-value="2" aria-label="輸入 2">2</button>
			<button type="button" data-value="3" aria-label="輸入 3">3</button>

		</div>
	</div>
</div>
<div class="modal" id="stats-modal" role="dialog" aria-modal="true" aria-labelledby="stats-title">
	<div class="modal-card">
		<h2 id="stats-title">遊戲統計</h2>
		<div class="stats-grid">
			<div class="stat"><span>已開始遊戲</span><strong id="stat-started">0</strong></div>
			<div class="stat"><span>已完成遊戲</span><strong id="stat-solved">0</strong></div>
			<div class="stat"><span>完成率</span><strong id="stat-completion">0%</strong></div>
			<div class="stat"><span>最佳時間</span><strong id="stat-best">—</strong></div>
			<div class="stat"><span>平均時間</span><strong id="stat-average">—</strong></div>
			<div class="stat"><span>使用提示</span><strong id="stat-hints">0</strong></div>
			<div class="stat"><span>總遊玩時間</span><strong id="stat-total-time">00:00</strong></div>
		</div>
		<h3>最近遊戲</h3>
		<ul class="history" id="history">
			<li class="empty" id="history-empty">尚無已完成遊戲。</li>
			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>
			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>
			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>
			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>

			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>
			<li class="history-item" hidden><span class="history-date"></span><span class="history-meta"></span></li>
		</ul>
		<div class="modal-actions">
			<button id="clear-stats" type="button">清除統計</button>
			<button id="close-stats" type="button">關閉</button>
		</div>
	</div>
</div>
<div class="modal" id="gold-modal" role="dialog" aria-modal="true" aria-labelledby="gold-title">
	<div class="modal-card">
		<h2 id="gold-title">金價詳細資訊</h2>
		<p class="empty" id="gold-empty">金價資料尚未載入。</p>
		<div id="gold-details" hidden>
			<div class="stats-grid">
				<div class="stat"><span>金屬</span><strong id="gold-metal"></strong></div>
				<div class="stat"><span>貨幣</span><strong id="gold-currency"></strong></div>
				<div class="stat"><span>目前價格</span><strong id="gold-current"></strong></div>
				<div class="stat"><span>更新時間</span><strong id="gold-updated"></strong></div>
			</div>
			<div class="gold-section">市場行情</div>
			<div class="stats-grid">
				<div class="stat"><span>漲跌</span><strong id="gold-change"></strong></div>
				<div class="stat"><span>前收盤</span><strong id="gold-prev-close"></strong></div>
				<div class="stat"><span>開盤價</span><strong id="gold-open"></strong></div>
				<div class="stat"><span>當日最高</span><strong id="gold-high"></strong></div>
				<div class="stat"><span>當日最低</span><strong id="gold-low"></strong></div>
				<div class="stat"><span>開盤時間</span><strong id="gold-open-time"></strong></div>
			</div>
			<div class="gold-section">買賣價</div>
			<div class="stats-grid">
				<div class="stat"><span>買入價（Bid）</span><strong id="gold-bid"></strong></div>
				<div class="stat"><span>賣出價（Ask）</span><strong id="gold-ask"></strong></div>
			</div>
			<div class="gold-section">單位換算</div>
			<div class="stats-grid">
				<div class="stat"><span>每金衡盎司</span><strong id="gold-troy-ounce"></strong></div>
				<div class="stat"><span>每克</span><strong id="gold-gram"></strong></div>
				<div class="stat"><span>每公斤</span><strong id="gold-kilogram"></strong></div>
				<div class="stat"><span>報價單位</span><strong id="gold-unit"></strong></div>
			</div>
			<div class="gold-section">成色每克價</div>
			<div class="stats-grid">
				<div class="stat"><span>24K</span><strong id="gold-24k"></strong></div>
				<div class="stat"><span>22K</span><strong id="gold-22k"></strong></div>
				<div class="stat"><span>18K</span><strong id="gold-18k"></strong></div>
				<div class="stat"><span>交易所</span><strong id="gold-exchange"></strong></div>
			</div>
		</div>
		<div class="modal-actions"><button id="close-gold" type="button">關閉</button></div>
	</div>
</div>

		<p id="celebration-message"></p>
		<button id="close-celebration" type="button">繼續</button>
	</div>
</div>
<script src="./assets/sudoku-game-main.js"></script>
<script>SudokuGameMain.newGame(false);</script>
